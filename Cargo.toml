[package]
name = "near-address-analyzer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Build:   cargo near build
# Deploy:  near contract deploy <account> use-file target/near/near_address_analyzer.wasm \
#            with-init-call new json-args '{"owner_id":"<your-account>"}' \
#            prepopulated-unsigned-transaction ... (or use `cargo near deploy`)
#
# Oracle submits data:
#   near contract call-function as-transaction <contract> submit_report \
#     json-args '{"account_id":"alice.near","created_at_ns":"1620000000000000000","transfers":[{"tx_hash":"abc...","amount":"1500000000000000000000000000"}]}' \
#     prepaid-gas '100 Tgas' attached-deposit '0 NEAR' sign-as <oracle>
#
# Anyone queries:
#   near contract call-function as-read-only <contract> analyze_address \
#     json-args '{"account_id":"alice.near"}' network-config mainnet now
